<html xmlns:th="http://www.thymeleaf.org"
        th:replace="~{viewTemplate :: viewLayout('Reports', 'List of Reports', 'reports', ~{::content})}">
<body>
    <th:block th:fragment="content">
        <!-- Page Specific content-->

        <div class="keyword-filter">
            <div class="keyword-filter-wrap">
                <input type="text" id="keyword" name="keyword" placeholder="Search by location or keyword" autocomplete="off">
                <img class="icon" th:src="@{/icons/magnify.svg}" alt="">
            </div>
        </div>
        <div class="panel" style="width: 1500px;">
            <table class="reports-table">
                <colgroup>
                    <col style="width: 44px;">
                    <col style="width: 13%;">
                    <col style="width: 15%;">
                    <col style="width: 15%;">
                    <col style="width: 24%;">
                    <col style="width: 13%;">
                    <col style="width: 8%;">
                    <col>
                </colgroup>
                <thead>
                    <tr>
                        <th><input type="checkbox" id="all-incidents"></th>
                        <th>Incident ID</th>
                        <th>Date</th>
                        <th>Location</th>
                        <th>Vehicle</th>
                        <th>License Plate</th>
                        <th>Driver</th>
                        <th>Image Preview</th>
                    </tr>
                </thead>
                <tr class="incident-row" th:each="incident : ${incidents}">
                    <td><input type="checkbox" th:id="|incident-${incident.incidentId}|"></td>
                    <td>
                        <a class="incident-link" th:href="@{/incident/{id}(id=${incident.incidentId})}"
                        th:text="${incident.incidentId}">N/A</a>
                    </td>
                    <td th:text="${#temporals.format(incident.createdTime, 'MM/dd/yyyy h:mm a')}">N/A</td>
                    <td th:text="${#numbers.formatDecimal(incident.latitude, 1, 4)} + ', ' + ${#numbers.formatDecimal(incident.longitude, 1, 4)}">N/A</td>
                    <td th:text="${incident.vehicleColor} + ' ' + ${incident.vehicleYear} + ' ' + ${incident.vehicleMake} + ' ' + ${incident.vehicleModel}">N/A</td>
                    <td th:text="${incident.licensePlate}">N/A</td>
                    <td th:text="${incident.driverPresent} ? 'Yes' : 'No'">No</td>
                    <td><span class="preview-placeholder"></span></td>
                </tr>
            </table>

            <nav class="page-selector" th:if="${totalPages gt 1}">
                <a class="page-button" th:classappend="${currentPage == 1} ? 'disabled'"
                th:href="@{/reports(pageNum=${currentPage - 1}, incidentsPerPage=${incidentsPerPage})}">&laquo;</a>
    
                <th:block th:each="p : ${pageButtons}">
                    <span class="page-button ellipsis" th:if="${p == -1}">...</span>
                    <a class="page-button" th:unless="${p == -1}"
                    th:classappend="${p == currentPage} ? 'active'"
                    th:href="@{/reports(pageNum=${p}, incidentsPerPage=${incidentsPerPage})}" th:text="${p}">1</a>
                </th:block>
    
                <a class="page-button" th:classappend="${currentPage == totalPages} ? 'disabled'"
                th:href="@{/reports(pageNum=${currentPage + 1}, incidentsPerPage=${incidentsPerPage})}">&raquo;</a>
            </nav>
        </div>

        <script>
            document.querySelectorAll('.incident-row').forEach(row => {
                row.addEventListener('click', function (event) {
                    const checkbox = this.querySelector('input[type="checkbox"]');
                    if (event.target !== checkbox && event.target !== this.querySelector('.incident-link')) {
                        checkbox.checked = !checkbox.checked;
                    }                    
                });
            });
        </script>

    </th:block>
</body>
</html>
