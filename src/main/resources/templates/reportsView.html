<html xmlns:th="http://www.thymeleaf.org"
        th:replace="~{viewTemplate :: viewLayout('Reports', 'List of Reports', 'reports', ~{::content})}">
<body>
    <th:block th:fragment="content">
        <!-- Page Specific content-->

        <div class="filter-items">
            <form th:action="@{/reports}" method="post">
                <input type="hidden" name="limit" th:value="${limit}">
                <div class="keyword-filter-wrap">
                    <input type="text" id="keyword" name="keyword" th:value="${keyword}"
                        placeholder="Search by ID or keyword" autocomplete="off">
                    <button type="submit" aria-label="Search">
                        <img class="icon" th:src="@{/icons/magnify.svg}" alt="">
                    </button>
                </div>
            </form>

            <button class="filter-button" popovertarget="filter-popover" aria-label="Filter">
                    <img class="icon" th:src="@{/icons/filter-outline.svg}" alt="">
                    Filter
            </button>

            <div id="filter-popover" class="filter-popover" popover>
                <div class="popover-header">
                    <label class="advanced-filters">Advanced Filters</label>
                    <button class="close-button" popovertarget="filter-popover" aria-label="Close">&times;</button>
                </div>

                    
                <form class="filter-menu" th:action="@{/reports}" method="post">
                    <input type="hidden" name="limit" th:value="${limit}">
                    <input type="hidden" name="keyword" th:value="${keyword}">

                    <div class="filter-row full">
                        <label>Vehicle Make</label>
                        <label>Vehicle Model</label>
                    </div>

                    <div class="filter-row full">
                        <select name="vehicleMake" th:value="${vehicleMake}">
                            <option value="">All</option>
                            <option th:each="make : ${vehicleMakes}" th:value="${make}" th:text="${make}"
                                th:selected="${make == vehicleMake}"></option>
                        </select>
                        <select name="vehicleModel" th:value="${vehicleModel}" th:disabled="${vehicleMake == null or vehicleMake == ''}">
                            <option value="">All</option>
                            <option th:each="model : ${vehicleModels}" th:value="${model}" th:text="${model}"
                                th:selected="${model == vehicleModel}"></option>
                        </select>
                    </div>

                    <div class="filter-row full">
                        <label>Vehicle Color</label>
                        <label>Vehicle Year</label>
                    </div>

                    <div class="filter-row full">
                        <input type="text" name="vehicleColor" th:value="${vehicleColor}" 
                            placeholder="Search by vehicle color" autocomplete="off">
                        <div class="year-range">
                            <select name="startYear" th:value="${startYear}">
                                <option value="">Min</option>
                            </select>
                            <label>to</label>
                            <select name="endYear" th:value="${endYear}">
                                <option value="">Max</option>
                            </select>
                        </div>
                    </div>

                    <div class="filter-row full">
                        <label>License Plate</label>
                        <label>Location</label>
                    </div>

                    <div class="filter-row full">
                        <input type="text" name="licensePlate" th:value="${licensePlate}"
                            placeholder="Search by license plate" autocomplete="off" maxlength="8"
                            pattern="[A-Za-z0-9]{0,8}" style="text-transform: uppercase;" 
                            oninput="this.value = this.value.replace(/[^A-Za-z0-9]/g, '')">
                        
                        <div class="location-search">    
                            <input type="text" name="location" th:value="${location}"
                                placeholder="Search by location" autocomplete="off">
                        
                            <div id="location-list" class="location-list hidden"></div>
                            
                        </div>
                    </div>

                    <div class="filter-row full">
                        <button form="reset-filters" class="reset-button" type="submit" aria-label="Reset">
                            <img class="icon" th:src="@{/icons/refresh.svg}" alt="">
                            Reset
                        </button>
                        <button type="submit" class="apply-filters-button">Apply Filters</button>
                    </div>
                </form>

                <form id="reset-filters" th:action="@{/reports}" method="post">
                    <input type="hidden" name="limit" th:value="${limit}">
                    <input type="hidden" name="keyword" th:value="${keyword}">
                </form>
            </div>
    
            <form th:action="@{/reports}" method="post">
                <input type="hidden" name="limit" th:value="${limit}">
                <button class="reset-button" type="submit" aria-label="Reset">
                    <img class="icon" th:src="@{/icons/refresh.svg}" alt="">
                    Reset
                </button>
            </form>

            <button id="clear-button" class="clear-button" aria-label="Clear">
                Clear Selection
            </button> 

            <button class="export-button" popovertarget="export-popover" aria-label="Export">
                Export &#9660;
            </button> 

            <div id="export-popover" class="export-popover" popover>
                <div class="popover-header">
                    <label class="export-options" style="font-size: medium;">Export Options</label>
                    <button class="close-button" popovertarget="export-popover" aria-label="Close">&times;</button>
                </div>

                <button class="export-all-button" onclick="exportTable('all')" aria-label="Export">
                <img class="icon" th:src="@{/icons/export.svg}" alt="">
                Export All
                </button> 

                <button class="export-filtered-button" onclick="exportTable('filtered')" aria-label="Export">
                <img class="icon" th:src="@{/icons/export.svg}" alt="">
                Export Filtered
                </button> 

                <button class="export-selected-button" onclick="exportTable('selected')" aria-label="Export">
                <img class="icon" th:src="@{/icons/export.svg}" alt="">
                Export Selected
                </button> 
            </div>


        </div>


        <div class="panel">
            <table class="reports-table">
                <colgroup>
                    <col style="width: 44px;">
                    <col style="width: 13%;">
                    <col style="width: 15%;">
                    <col style="width: 15%;">
                    <col style="width: 24%;">
                    <col style="width: 13%;">
                    <col style="width: 8%;">
                    <col>
                </colgroup>
                <thead>
                    <tr>
                        <th><input type="checkbox" id="all-incidents"></th>
                        <th>Incident ID</th>
                        <th>Date</th>
                        <th>Location</th>
                        <th>Vehicle</th>
                        <th>License Plate</th>
                        <th>Driver</th>
                        <th>Image Preview</th>
                    </tr>
                </thead>
                <tr th:if="${#lists.isEmpty(incidents)}">
                    <td colspan="8">No incidents match your search.</td>
                </tr>
                <tr class="incident-row" th:each="incident : ${incidents}" th:data-id="${incident.incidentId}">
                    <td><input type="checkbox"></td>
                    <td>
                        <a class="incident-link" th:href="@{/incident/{id}(id=${incident.incidentId})}"
                        th:text="${incident.incidentId}">N/A</a>
                    </td>
                    <td th:text="${#temporals.format(incident.createdTime, 'MM/dd/yyyy h:mm a')}">N/A</td>
                    <td th:text="${incident.location}">N/A</td>
                    <td th:text="${incident.vehicleColor} + ' ' + ${incident.vehicleYear} + ' ' + ${incident.vehicleMake} + ' ' + ${incident.vehicleModel}">N/A</td>
                    <td th:text="${incident.licensePlate}">N/A</td>
                    <td th:text="${incident.driverPresent} ? 'Yes' : 'No'">No</td>
                    <td>
                        <div class="incident-row-image">
                            <img th:src="@{/Images/{id}(id=${incident.imageId})}" onerror="this.onerror=null; this.src='/Images/PlaceHolder.jpg'">
                            <div class="image-popup">
                                <img th:src="@{/Images/{id}(id=${incident.imageId})}" onerror="this.onerror=null; this.src='/Images/PlaceHolder.jpg'">
                            </div>
                        </div>
                    </td>
                </tr>
            </table>

            <nav class="page-selector" th:if="${totalPages gt 1}">
                <a class="page-button" th:classappend="${currentPage == 1} ? 'disabled'"
                th:href="@{/reports(pageNum=${currentPage - 1}, limit=${limit})}">&lt;</a>
    
                <th:block th:each="p : ${pageButtons}">
                    <span class="page-button ellipsis" th:if="${p == -1}">...</span>
                    <a class="page-button" th:unless="${p == -1}"
                    th:classappend="${p == currentPage} ? 'active'"
                    th:href="@{/reports(pageNum=${p}, limit=${limit})}" th:text="${p}">1</a>
                </th:block>
    
                <a class="page-button" th:classappend="${currentPage == totalPages} ? 'disabled'"
                th:href="@{/reports(pageNum=${currentPage + 1}, limit=${limit})}">&gt;</a>
            </nav>
        </div>

        <script>
            const selectedIncidents = new Set(JSON.parse(sessionStorage.getItem('selectedIncidents') || '[]'))

            const clearSelection = document.getElementById('clear-button');
            const selectAllCheckbox = document.getElementById('all-incidents');
            const rows = document.querySelectorAll('.incident-row');

            selectAllCheckbox.addEventListener('change', function () {
                rows.forEach(row => {
                    row.querySelector('input[type="checkbox"]').checked = this.checked;
                });
            });
            
            
            rows.forEach(row => {
                const checkbox = row.querySelector('input[type="checkbox"]');
                checkbox.checked = selectedIncidents.has(row.dataset.id);

                row.addEventListener('click', function (event) {
                    if (event.target !== checkbox && event.target !== this.querySelector('.incident-link')) {
                        checkbox.checked = !checkbox.checked;

                        if (checkbox.checked) selectedIncidents.add(this.dataset.id);
                        else selectedIncidents.delete(this.dataset.id);
                        sessionStorage.setItem('selectedIncidents', JSON.stringify([...selectedIncidents]))
                        
                        if (rows.length === document.querySelectorAll('.incident-row input[type="checkbox"]:checked').length) {
                            selectAllCheckbox.checked = true;
                        } else {
                            selectAllCheckbox.checked = false;
                        }
                    }
                });
            });

            clearSelection.addEventListener('click', function () {
                sessionStorage.removeItem('selectedIncidents');
                rows.forEach(row => {
                    const checkbox = row.querySelector('input[type="checkbox"]');
                    checkbox.checked = false;
                    selectAllCheckbox.checked = false;
                });
            });

            document.querySelectorAll('form').forEach(form =>
                form.addEventListener('submit', function () {   
                    sessionStorage.removeItem('selectedIncidents');
                })
            );
        </script>

        <script>
            const vehicleMakeSelect = document.querySelector('select[name="vehicleMake"]');
            const vehicleModelSelect = document.querySelector('select[name="vehicleModel"]');

            vehicleMakeSelect.addEventListener('change', function () {
                const selectedMake = this.value;

                if (selectedMake) {
                    fetch(`/api/models?vehicleMake=${selectedMake}`)
                        .then(response => response.json())
                        .then(models => {
                            vehicleModelSelect.innerHTML = '<option value="">All</option>';
                            models.forEach(model => {
                                const option = document.createElement('option');
                                option.value = model;
                                option.textContent = model;
                                vehicleModelSelect.appendChild(option);
                            });
                            vehicleModelSelect.disabled = false;
                        });
                } else {
                    vehicleModelSelect.innerHTML = '<option value="">All</option>';
                    vehicleModelSelect.disabled = true;
                }
            });
        </script>

        <script>
            // Reports are filtered and paged on the server, so a new calendar range reloads the page with it.
            // The range the page was built with is announced once on load and is ignored.
            (function () {
                const dateRange = document.getElementById('date-range');
                const shownStart = dateRange.dataset.rangeStart || null;
                const shownStop = dateRange.dataset.rangeStop || null;

                function isoDate(date) {
                    if (date === null) {
                        return null;
                    }
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    return date.getFullYear() + '-' + month + '-' + day;
                }

                document.addEventListener('daterangechange', function (event) {
                    const start = isoDate(event.detail.startDate);
                    const stop = isoDate(event.detail.stopDate);
                    if (start === shownStart && stop === shownStop) {
                        return;
                    }
                    const params = new URLSearchParams({ limit: document.querySelector('input[name="limit"]').value });
                    if (start === null) {
                        params.set('allTime', 'true');
                    } else {
                        params.set('start', start);
                        params.set('stop', stop);
                    }
                    window.location.href = '/reports?' + params.toString();
                });
            })();
        </script>

        <script>
            let startYear = [[${startYear}]];
            let endYear = [[${endYear}]];
            
            const startYearSelect = document.querySelector('select[name="startYear"]');
            const endYearSelect = document.querySelector('select[name="endYear"]');

            for (let year = new Date().getFullYear() + 1; year >= 1950; year--) {
                startYearSelect.add(new Option(year, year));
                endYearSelect.add(new Option(year, year));
            }

            if (startYear > 0) startYearSelect.value = startYear;
            if (endYear > 0) endYearSelect.value = endYear;

            startYearSelect.addEventListener('change', function () {
                startYear = this.value;

                if (startYear > endYear) {
                    endYearSelect.value = "";
                    endYear = -1;
                }
            });

            endYearSelect.addEventListener('change', function () {
                endYear = this.value;

                if (endYear < startYear) {
                    startYearSelect.value = "";
                    startYear = -1;
                }
            });
        </script>

        <script>
            const locationSearch = document.querySelector('input[name="location"]');
            const locationList = document.getElementById('location-list');

            locationSearch.addEventListener("input", function() {
                const input = locationSearch.value.trim();
                
                fetch(`api/locations?q=${encodeURIComponent(input)}`)
                .then(response => response.json())
                .then(locations => {
                    locationList.innerHTML = "";
                    locationList.classList.remove('hidden');

                    if (locations.length == 0) {
                        const div = document.createElement('div');
                        div.textContent = "No Locations Found";
                        locationList.appendChild(div);
                    }
                    locations.forEach(l => {
                        const div = document.createElement('div');
                        div.textContent = l;

                        div.addEventListener('click', function () {
                            locationSearch.value = l;
                            locationList.innerHTML = "";
                        });

                        div.addEventListener('mouseenter', function () {
                            locationSearch.value = l;
                        });

                        div.addEventListener('mouseleave', function () {
                            locationSearch.value = input;
                        });

                        locationList.appendChild(div);
                    });
                }
                ).catch(error => console.log("Error fecthing location:", error));
            
            });

            document.addEventListener('click', function(e) {
                if (e.target != locationSearch) {
                    locationList.classList.add('hidden');
                }
            });            
        </script>

        <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
        <script type="text/javascript" th:src="@{/js/export.js}"></script>

    </th:block>
</body>
</html>
